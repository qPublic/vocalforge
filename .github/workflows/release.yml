name: Release

# Push a tag like v0.1.1 to build the installer and publish it to GitHub Releases.
# Installed copies of the app pick the new version up automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The native audio engine is bundled into the installer and covered by the tests.
      - run: npm run build:engine
      - run: npm test
      # Create the release up front as a draft: electron-builder uploads files in parallel and can
      # otherwise race to create duplicate releases, and a draft is invisible to the updater, so nobody
      # sees a release before all its files are there. Tags with a hyphen are pre-releases.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --draft $flag --title "$GITHUB_REF_NAME" --generate-notes || true
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish only once the update manifest and installer are attached.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.[][].name')
          echo "$assets"
          echo "$assets" | grep -qx 'latest.yml'
          echo "$assets" | grep -q 'Setup.*\.exe$'
          gh release edit "$GITHUB_REF_NAME" --draft=false
