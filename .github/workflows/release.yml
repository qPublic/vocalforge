name: Release

# Push a tag like v0.1.1 to build the installer and publish it to GitHub Releases.
# Installed copies of the app pick the new version up automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Create the release up front: electron-builder uploads files in parallel and can
      # otherwise race to create duplicate releases. Tags with a hyphen are pre-releases.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $flag --title "$GITHUB_REF_NAME" --generate-notes || true
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
